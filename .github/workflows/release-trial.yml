name: Release trial

# Builds everything a release needs (the Windows installer, the Linux packages, their update
# signatures and latest.json) and publishes none of it. Run it by hand, or let it run when a file that shapes a release changes, so a
# broken release is found on a pull request and not on release day.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release*.yml"
      - "apps/desktop/src-tauri/tauri.conf.json"
      - "apps/desktop/src-tauri/tauri.linux.conf.json"
      - "apps/desktop/src-tauri/installer/**"
      - "apps/desktop/src-tauri/Cargo.toml"
      - "scripts/latest-json.ts"
      - "scripts/linux-release.sh"
      - "packaging/**"
      - "release-please-config.json"

permissions:
  contents: read

concurrency:
  group: release-trial-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  trial:
    name: Trial release (nothing is published)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # Until the real signing key is a repository secret, the trial signs with a key made just now.
      # The installer it makes then carries signatures the app would not trust, and it is thrown away.
      - name: Choose the update signing key
        shell: pwsh
        env:
          REAL_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          REAL_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:REAL_KEY) {
            "TAURI_SIGNING_PRIVATE_KEY<<KEY_END`n$env:REAL_KEY`nKEY_END" >> $env:GITHUB_ENV
            "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$env:REAL_KEY_PASSWORD" >> $env:GITHUB_ENV
            "SIGNED_WITH_REAL_KEY=true" >> $env:GITHUB_ENV
            "Signing with the real update key."
          } else {
            $key = Join-Path $env:RUNNER_TEMP "trial.key"
            pnpm --filter @arden/desktop exec tauri signer generate --ci -p trial-key -w $key
            "TAURI_SIGNING_PRIVATE_KEY=$key" >> $env:GITHUB_ENV
            "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=trial-key" >> $env:GITHUB_ENV
            "::warning::The TAURI_SIGNING_PRIVATE_KEY secret is not set, so this trial signed with a throwaway key."
          }

      - name: Build the installer
        run: pnpm --filter @arden/desktop exec tauri build

      - name: Find the installer and its signature
        id: files
        shell: pwsh
        run: |
          $bundle = "target/release/bundle/nsis"
          $installer = Get-ChildItem $bundle -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "No installer was made in $bundle" }
          $signature = "$($installer.FullName).sig"
          if (-not (Test-Path $signature)) { throw "The installer has no update signature" }
          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "signature=$signature" >> $env:GITHUB_OUTPUT
          "name=$($installer.Name)" >> $env:GITHUB_OUTPUT
          "size=$($installer.Length)" >> $env:GITHUB_OUTPUT
          "The installer is $($installer.Name), $([math]::Round($installer.Length / 1MB, 1)) MB."

      - name: Install it silently, check the terminal command and the PATH, and uninstall it
        run: pnpm --filter @arden/desktop test:e2e:installer

      - name: Make latest.json
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if (-not $version) { $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value }
          $url = "https://github.com/${{ github.repository }}/releases/download/v$version/" + [uri]::EscapeDataString("${{ steps.files.outputs.name }}")
          # Signed with the real key, the signature must be one the app trusts, as in a release.
          $check = @()
          if ($env:SIGNED_WITH_REAL_KEY) {
            $check = @("--trusted-key", (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).plugins.updater.pubkey)
          }
          node scripts/latest-json.ts --version $version --url $url --signature-file "${{ steps.files.outputs.signature }}" --notes "Trial release" @check > latest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content latest.json

      - name: Keep the results for a few days
        uses: actions/upload-artifact@v4
        with:
          name: trial-release
          path: |
            ${{ steps.files.outputs.installer }}
            ${{ steps.files.outputs.signature }}
            latest.json
          retention-days: 3
          if-no-files-found: error

  linux:
    name: Trial Linux packages (nothing is published)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install the system libraries Tauri builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev file

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # As on Windows: the real key when it is a secret, otherwise one made just now.
      - name: Choose the update signing key
        env:
          REAL_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          REAL_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$REAL_KEY" ]; then
            { echo "TAURI_SIGNING_PRIVATE_KEY<<KEY_END"; echo "$REAL_KEY"; echo "KEY_END"; } >> "$GITHUB_ENV"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$REAL_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "TRUSTED_KEY=$(node -e 'console.log(require("./apps/desktop/src-tauri/tauri.conf.json").plugins.updater.pubkey)')" >> "$GITHUB_ENV"
            echo "Signing with the real update key."
          else
            key="$RUNNER_TEMP/trial.key"
            pnpm --filter @arden/desktop exec tauri signer generate --ci -p trial-key -w "$key"
            echo "TAURI_SIGNING_PRIVATE_KEY=$key" >> "$GITHUB_ENV"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=trial-key" >> "$GITHUB_ENV"
            echo "::warning::The TAURI_SIGNING_PRIVATE_KEY secret is not set, so this trial signed with a throwaway key."
          fi

      - name: Build the packages
        run: pnpm --filter @arden/desktop exec tauri build

      - name: Find the packages and their signatures, and make the Linux part of latest.json
        run: |
          version="$(node -e 'console.log(require("./apps/desktop/src-tauri/tauri.conf.json").version ?? "")')"
          if [ -z "$version" ]; then version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"; fi
          scripts/linux-release.sh "$version" "https://github.com/${{ github.repository }}/releases/download/v$version" "${TRUSTED_KEY:-}"

      - name: Install the .deb, check the terminal command, and remove it
        run: |
          sudo apt-get install -y ./release/*.deb
          test -x /usr/bin/arden-code
          arden-code --version
          test -f "/usr/share/applications/Arden Code.desktop"
          sudo apt-get remove -y arden-code

      - name: Keep the results for a few days
        uses: actions/upload-artifact@v4
        with:
          name: trial-release-linux
          path: release
          retention-days: 3
          if-no-files-found: error
