name: Release PR

# Keeps a pull request open that holds the next version and its changelog, made from the commit
# messages. Merging it tags the version, which starts the Release workflow. It is switched off: it
# does nothing until the repository variable RELEASES_ENABLED is "true".

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Update the release pull request
    if: ${{ vars.RELEASES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
