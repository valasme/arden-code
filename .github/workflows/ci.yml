name: CI

on:
  push:
    branches: [main, foundation]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - name: Install the browser for component tests
        run: pnpm --filter @arden/desktop exec playwright install chromium-headless-shell

      - name: Format
        run: pnpm format:check && pnpm format:rust:check

      - name: Lint
        run: pnpm lint && pnpm lint:rust

      - name: Type-check
        run: pnpm typecheck

      - name: Unused code and dependencies
        run: pnpm knip

      - name: Hard-coded UI text
        run: pnpm i18n:lint

      - name: UI tests
        run: pnpm test

      - name: Rust tests
        run: pnpm test:rust

      - name: Bindings drift check
        shell: bash
        run: |
          pnpm bindings
          git diff --exit-code -- apps/desktop/src/ipc/bindings.ts

      - name: Brand outputs are up to date
        run: pnpm brand:check

      - name: Build the app
        run: pnpm build

      - name: End-to-end test against the real app
        run: pnpm test:e2e

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Spelling
        uses: crate-ci/typos@v1.50.3
      - name: Dependency advisories and licenses
        uses: EmbarkStudios/cargo-deny-action@v2
