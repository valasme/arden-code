name: CI

on:
  push:
    branches: [main, foundation]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # The foundation branch takes many pushes in a row; let each run finish so none is lost.
  cancel-in-progress: ${{ github.ref != 'refs/heads/foundation' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - name: Install the browser for component tests
        run: pnpm --filter @arden/desktop exec playwright install chromium-headless-shell

      - name: Format
        run: pnpm format:check && pnpm format:rust:check

      - name: Lint
        run: pnpm lint && pnpm lint:rust

      - name: Type-check
        run: pnpm typecheck

      - name: Unused code and dependencies
        run: pnpm knip

      - name: Hard-coded UI text
        run: pnpm i18n:lint

      - name: UI tests
        run: pnpm test

      - name: Design system screenshots and interaction tests
        run: pnpm test:visual

      - name: Rust tests
        run: pnpm test:rust

      - name: Bindings drift check
        shell: bash
        run: |
          pnpm bindings
          git diff --exit-code -- apps/desktop/src/ipc/bindings.ts

      - name: Brand outputs are up to date
        run: pnpm brand:check

      - name: The list of open-source licenses is up to date
        run: pnpm licenses:check

      - name: Build the app
        run: pnpm build

      - name: WebView2 runtime version
        shell: pwsh
        run: |
          $key = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          if (Test-Path $key) { "WebView2 runtime $((Get-ItemProperty $key).pv)" } else { "WebView2 runtime is NOT installed" }

      - name: End-to-end test against the real app
        run: pnpm test:e2e

      - name: Performance against the plan's targets, on the release build
        run: pnpm --filter @arden/desktop test:perf

      - name: What was running when a test failed
        if: failure()
        shell: pwsh
        run: |
          Get-Process | Where-Object { $_.ProcessName -match "arden|webview2" } | Format-Table Id, ProcessName, MainWindowTitle

      # A test that times out says only that; the page as it stood is in its error context.
      - name: Keep what the failed tests saw
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: apps/desktop/test-results
          if-no-files-found: ignore
          retention-days: 14

  # The shared product on Linux (ADR 0057): the same checks as Windows, but for what is Windows'
  # own (the screenshot baselines, WebView2 and the performance gates), and the end-to-end test
  # through WebDriver (ADR 0063). It gates a merge as the Windows check does.
  check-linux:
    name: Check (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install the system libraries Tauri builds against, and WebKitGTK's WebDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev \
            webkit2gtk-driver xvfb dbus-x11

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri's WebDriver server
        run: cargo install tauri-driver --version 2.1.0 --locked

      - run: pnpm install --frozen-lockfile

      - name: Install the browser for component tests
        run: pnpm --filter @arden/desktop exec playwright install --with-deps chromium-headless-shell

      - name: Format
        run: pnpm format:check && pnpm format:rust:check

      - name: Lint
        run: pnpm lint && pnpm lint:rust

      - name: Type-check
        run: pnpm typecheck

      - name: Unused code and dependencies
        run: pnpm knip

      - name: Hard-coded UI text
        run: pnpm i18n:lint

      - name: UI tests
        run: pnpm test

      - name: Rust tests
        run: pnpm test:rust

      - name: Bindings drift check
        run: |
          pnpm bindings
          git diff --exit-code -- apps/desktop/src/ipc/bindings.ts

      - name: Build the app
        run: pnpm build

      - name: WebKitGTK version
        run: pkg-config --modversion webkit2gtk-4.1

      - name: End-to-end test against the real app
        run: xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" dbus-run-session -- pnpm test:e2e:linux

      - name: What was running when a test failed
        if: failure()
        run: ps -eo pid,ppid,stat,args | grep -E "arden|claude|WebKit" | grep -v grep || true

      - name: Keep what the failed tests saw
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: apps/desktop/test-results
          if-no-files-found: ignore
          retention-days: 14

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Spelling
        uses: crate-ci/typos@v1.50.3
      - name: Dependency advisories and licenses
        uses: EmbarkStudios/cargo-deny-action@v2
