[workspace]
resolver = "3"
members = [
  "crates/arden-agents",
  "crates/arden-cli",
  "crates/arden-core",
  "crates/arden-diagnostics",
  "crates/arden-process",
  "crates/arden-settings",
  "crates/arden-windows",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/valasme/arden-code"
authors = ["valasme"]

[workspace.dependencies]
arden-agents = { path = "crates/arden-agents" }
arden-core = { path = "crates/arden-core" }
arden-diagnostics = { path = "crates/arden-diagnostics" }
arden-process = { path = "crates/arden-process" }
arden-settings = { path = "crates/arden-settings" }
arden-windows = { path = "crates/arden-windows" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }

specta = { version = "=2.0.0-rc.25", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
