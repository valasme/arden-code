[package]
name = "arden-process"
description = "Arden Code's process supervisor: finds programs on PATH, starts them safely, and stops them with the app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_IO",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
